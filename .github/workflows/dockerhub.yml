name: Containers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish nerve-agent image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve container images
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
        run: |
          set -euo pipefail
          ghcr_image="${GHCR_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER}/nerve-agent}"
          ghcr_image="$(printf '%s' "$ghcr_image" | tr '[:upper:]' '[:lower:]')"
          images="$ghcr_image"

          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice title=Docker Hub skipped::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in nerve-ink/nerve-agent to publish Docker Hub images."
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
          else
            image="${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME}/nerve-agent}"
            images="${images}"$'\n'"${image}"
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: ${{ steps.image.outputs.dockerhub_enabled == 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
